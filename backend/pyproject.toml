[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "ASYNC"]
ignore = [
  "S101",   # assert is fine in tests and in explicit invariants
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "ASYNC230"]
"app/services/prompts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
