# Render Blueprint for DiffWitch (free plan).
#
# Blueprint Path: backend/render.yaml
# Root Directory: backend
#
# Secrets are marked `sync: false`: Render asks for them in the dashboard and
# they are never stored in git.

services:
  - type: web
    name: diffwitch-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: REVIEW_MODE
        value: lite
      - key: MAX_AGENT_STEPS
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_RPM
        sync: false
      - key: LLM_RPD
        sync: false
      - key: DAILY_LLM_BUDGET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY_B64
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
