# Template for the PyPI package. `scripts/build_wheel.py` copies this file into
# build/pypi/ next to a generated `diffwitch/` package and builds from there.
# Bump `version` here for each release; the tag must match it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffwitch"
version = "0.1.0"
description = "Review a unified diff with an AI reviewer from the command line."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divy Srivastava" }]
keywords = ["code-review", "pull-request", "github", "llm", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.28,<0.29",
  "mcp>=2.3,<3",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
]

[project.scripts]
diffwitch = "diffwitch.cli.review_diff:main"

[project.urls]
Homepage = "https://github.com/Divys0mCS/DiffWitch"
Issues = "https://github.com/Divys0mCS/DiffWitch/issues"
Source = "https://github.com/Divys0mCS/DiffWitch"

[tool.setuptools.packages.find]
include = ["diffwitch*"]
namespaces = false
