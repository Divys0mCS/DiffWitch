name: publish-cli

# Publishes the `diffwitch` CLI to PyPI. Requires a trusted publisher on PyPI
# (see docs/PUBLISHING.md) — no API token is stored in this repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token exchanged for a short-lived PyPI credential
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Install backend dev requirements
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run the backend test suite
        working-directory: backend
        run: python -m pytest

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, tomllib

          version = tomllib.loads(pathlib.Path("pypi/pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["TAG"].lstrip("v")
          print(f"tag={tag} version={version}")
          if tag != version:
              sys.exit(f"tag {tag!r} does not match pypi/pyproject.toml version {version!r}")
          PY

      - name: Assemble the wheel
        run: python scripts/build_wheel.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
